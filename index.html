<style>
:root{--ink:#263238;--muted:#6b7c84;--orange:#EDAC4F;--teal:#BCDEDE;--pink:#F5A0BA;--shadow:0 12px 30px rgba(38,50,56,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"League Spartan","Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff7ec 0%,#eaf5f5 52%,#fdeaf4 100%)}
.card{position:relative;isolation:isolate;overflow:hidden;width:min(420px,100%);background:rgba(255,255,255,.92);border-radius:30px;padding:34px 28px 28px;box-shadow:var(--shadow);text-align:center;border:2px solid #fff}
.card:before{content:"";position:absolute;z-index:-1;width:190px;height:190px;border-radius:50%;background:#EDAC4F33;right:-70px;top:-80px}
.logo{width:96px;height:96px;margin:0 auto 8px;display:block}
h1{font-size:26px;line-height:1.05;margin:6px 0 4px}
.sub{margin:0 0 20px;color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.06em}
label{display:block;text-align:left;font-weight:800;font-size:13px;margin:12px 0 6px}
.field{position:relative}
input{width:100%;border:3px solid #e4f3f3;border-radius:16px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff;outline:none}
input:focus{border-color:var(--orange)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;cursor:pointer;padding:6px}
.btn{margin-top:20px;width:100%;border:0;border-radius:18px;padding:15px;background:var(--orange);color:#4a2f00;font:inherit;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #c98b2c}
.btn:disabled{opacity:.7;cursor:wait}
.err{min-height:22px;margin:12px 0 0;color:#c0456b;font-weight:800;font-size:14px}
.note{margin:12px 0 0;color:var(--muted);font-size:12px}
</style>

const ITER=200000;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveBits(login,pass,salt){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(login.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:ITER},base,256));
}
async function openWith(kb){
 const buf=b64(DATA),iv=buf.slice(16,28),ct=buf.slice(28);
 const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct));
}
function show(html){document.open();document.write(html);document.close()}
async function restore(){
 const k=sessionStorage.getItem('ae_k');if(!k)return;
 try{show(await openWith(b64(k)))}catch(e){sessionStorage.removeItem('ae_k')}
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
document.getElementById('eye').onclick=()=>{const p=document.getElementById('p');p.type=p.type==='password'?'text':'password'};
if(!(window.crypto&&crypto.subtle)){err.textContent='Abra pelo link do site (https) para entrar.'}
else{
 restore();
 f.onsubmit=async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;
  try{
   const salt=b64(DATA).slice(0,16);
   const kb=await deriveBits(document.getElementById('u').value,document.getElementById('p').value,salt);
   const html=await openWith(kb);
   try{sessionStorage.setItem('ae_k',btoa(String.fromCharCode.apply(null,kb)))}catch(x){}
   show(html);
  }catch(x){
   await new Promise(r=>setTimeout(r,900));
   err.textContent='Usuário ou senha incorretos. Tente de novo.';go.disabled=false;
  }
 };
}
